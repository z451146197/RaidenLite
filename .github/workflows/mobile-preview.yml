name: Build Mobile Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mobile-web-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout game project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: package.json

      - name: Install Cocos CLI
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 0.0.1-alpha.35 https://github.com/cocos/cocos-cli.git "$RUNNER_TEMP/cocos-cli"
          cd "$RUNNER_TEMP/cocos-cli"
          npm install -g node-gyp
          npm run init
          npm install
          npm run download-tools
          npm run build

          # tsc outputs dist/cli.js without the executable bit on Linux.
          # npm link creates the global `cocos` symlink but does not fix the target mode.
          chmod +x dist/cli.js
          npm link
          chmod +x "$(npm prefix -g)/bin/cocos" || true
          cocos --version || cocos --help

      - name: Build Web Mobile
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/web-mobile
          if ! cocos --no-interactive build --project "$GITHUB_WORKSPACE" --platform web-mobile --config "$GITHUB_WORKSPACE/tools/build-preview.json"; then
            echo "Config-file build failed; retrying with project/platform defaults."
            rm -rf build/web-mobile
            cocos --no-interactive build --project "$GITHUB_WORKSPACE" --platform web-mobile
          fi

          if [ ! -f build/web-mobile/index.html ]; then
            echo "Expected build/web-mobile/index.html was not produced."
            find build -maxdepth 3 -type f | sort | head -200 || true
            exit 1
          fi

          touch build/web-mobile/.nojekyll

      - name: Keep downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaidenLite-web-mobile
          path: build/web-mobile
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web-mobile

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
