name: Build Mobile Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mobile-web-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: macos-15
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout game project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0

      - name: Validate project sources
        shell: bash
        run: |
          node tools/check-project.cjs
          node tools/check-mission01.cjs

      - name: Restore Cocos CLI cache
        id: cocos-cli-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cocos-cli
          key: cocos-cli-${{ runner.os }}-0.0.1-alpha.35-v1

      - name: Prepare Cocos CLI
        shell: bash
        run: |
          set -euxo pipefail
          CLI_DIR="$RUNNER_TEMP/cocos-cli"

          if [ "${{ steps.cocos-cli-cache.outputs.cache-hit }}" != "true" ] || [ ! -f "$CLI_DIR/dist/cli.js" ]; then
            rm -rf "$CLI_DIR"
            git clone --depth 1 --branch 0.0.1-alpha.35 https://github.com/cocos/cocos-cli.git "$CLI_DIR"
            cd "$CLI_DIR"
            npm install -g node-gyp
            npm run init
            npm install
            npm run download-tools
            npm run build
          else
            echo "Using cached Cocos CLI build."
          fi

          chmod +x "$CLI_DIR/dist/cli.js"
          echo "COCOS_CLI_JS=$CLI_DIR/dist/cli.js" >> "$GITHUB_ENV"
          node "$CLI_DIR/dist/cli.js" --version || node "$CLI_DIR/dist/cli.js" --help

      - name: Save Cocos CLI cache
        if: steps.cocos-cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cocos-cli
          key: cocos-cli-${{ runner.os }}-0.0.1-alpha.35-v1

      # Cocos Creator keeps compiled engine bundles in its global temp directory.
      # GitHub-hosted runners are ephemeral, so persist that directory separately and
      # mount it back where Creator expects it. The key changes when engine-affecting
      # project/build settings change, while restore-keys still lets Cocos reuse older
      # compatible engine hashes already present in the cache directory.
      - name: Restore Cocos engine build cache
        id: cocos-engine-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cocos-engine-cache
          key: cocos-engine-${{ runner.os }}-creator-3.8.8-cli-alpha.35-${{ hashFiles('settings/**/*.json', 'tools/build-preview.json', 'package.json') }}
          restore-keys: |
            cocos-engine-${{ runner.os }}-creator-3.8.8-cli-alpha.35-

      - name: Mount Cocos engine build cache
        shell: bash
        run: |
          set -euxo pipefail
          CACHE_DIR="$RUNNER_TEMP/cocos-engine-cache"
          GLOBAL_BUILDER_DIR="${TMPDIR%/}/CocosCreator/3.8.8/builder"

          mkdir -p "$CACHE_DIR" "$GLOBAL_BUILDER_DIR"
          rm -rf "$GLOBAL_BUILDER_DIR/engine"
          ln -s "$CACHE_DIR" "$GLOBAL_BUILDER_DIR/engine"

          echo "COCOS_ENGINE_CACHE_DIR=$CACHE_DIR" >> "$GITHUB_ENV"
          echo "Mounted Creator engine cache: $GLOBAL_BUILDER_DIR/engine -> $CACHE_DIR"
          du -sh "$CACHE_DIR" || true

      - name: Build Web Mobile
        id: build
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/web-mobile
          if ! node "$COCOS_CLI_JS" --no-interactive build --project "$GITHUB_WORKSPACE" --platform web-mobile --config "$GITHUB_WORKSPACE/tools/build-preview.json"; then
            echo "Config-file build failed; retrying with project/platform defaults."
            rm -rf build/web-mobile
            node "$COCOS_CLI_JS" --no-interactive build --project "$GITHUB_WORKSPACE" --platform web-mobile
          fi

          if [ ! -f build/web-mobile/index.html ]; then
            echo "Expected build/web-mobile/index.html was not produced."
            find build -maxdepth 3 -type f | sort | head -200 || true
            exit 1
          fi

          touch build/web-mobile/.nojekyll

      - name: Save Cocos engine build cache
        if: always() && steps.cocos-engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cocos-engine-cache
          key: cocos-engine-${{ runner.os }}-creator-3.8.8-cli-alpha.35-${{ hashFiles('settings/**/*.json', 'tools/build-preview.json', 'package.json') }}

      - name: Keep downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaidenLite-web-mobile
          path: build/web-mobile
          if-no-files-found: error
          compression-level: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web-mobile

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
